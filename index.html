<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Absen Guru Malika IBS</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        input, button, select { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        #reader { width: 100%; margin-top: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Absen Guru Malika Boarding School</h2>
    
    <label>Nama Guru (Ketik untuk mencari):</label>
    <input list="list-guru" id="namaGuru" placeholder="Contoh: Ahmad...">
    <datalist id="list-guru">
        <option value="Memuat data guru...">
    </datalist>

    <div id="reader"></div>
    <button id="btn-scan" onclick="startScanner()">Buka Kamera Scan QR Kelas</button>

    <div id="form-hasil" class="hidden">
        <h3>Data Kelas & Jam Pelajaran</h3>
        <input type="text" id="hasil-kelas" readonly style="background:#eee; font-weight:bold;">
        <input type="text" id="hasil-jam" readonly style="background:#eee; color:#3498db; font-weight:bold;">
        
        <label>Ambil Foto Selfie di Kelas:</label>
        <input type="file" id="fotoSelfie" accept="image/*" capture="user">
        
        <button id="btn-hadir" onclick="submitAbsen()" style="background: #2ecc71; color: white; font-weight: bold; font-size: 1.2em;">HADIR</button>
    </div>

    <script>
        // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZ38WohQc-pwQuOxVY5f_dI46edC6zVGKEhrn-lHMIM0_wrHqzqESHVE5i_CYlOwq48A/exec'; 

        let jadwalHariIni = [];
        let dataScanAktif = {};

        // 1. Tarik Data Guru dan Jadwal saat aplikasi dibuka
        window.onload = async function() {
            try {
                const response = await fetch(APPS_SCRIPT_URL + '?action=getInitData');
                const data = await response.json();
                
                jadwalHariIni = data.jadwalHariIni;
                
                const datalist = document.getElementById('list-guru');
                datalist.innerHTML = ''; 
                data.guru.forEach(nama => {
                    let option = document.createElement('option');
                    option.value = nama;
                    datalist.appendChild(option);
                });
            } catch (e) {
                alert("Gagal memuat data dari server. Pastikan koneksi internet stabil.");
            }
        };

        // Fungsi pembantu mengubah "07:30" menjadi format Waktu
        function parseTime(timeStr) {
            let now = new Date();
            let parts = timeStr.split(':');
            now.setHours(parseInt(parts[0]), parseInt(parts[1]), 0, 0);
            return now;
        }

        // 2. Mulai Kamera
        function startScanner() {
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText, decodedResult) => {
                    html5QrCode.stop();
                    document.getElementById('reader').classList.add('hidden');
                    document.getElementById('btn-scan').classList.add('hidden');
                    document.getElementById('form-hasil').classList.remove('hidden');
                    
                    // Format QR contoh: "QR-KL-VII.1 (PUTRA)" -> kita ambil "VII.1 (PUTRA)"
                    let namaKelas = decodedText.replace('QR-KL-', '').trim();
                    document.getElementById('hasil-kelas').value = "Kelas: " + namaKelas;
                    
                    // 3. Pencocokan Jam Realtime dengan Jadwal
                    let now = new Date();
                    let currentJam = null;

                    for (let j of jadwalHariIni) {
                        let start = parseTime(j.mulai);
                        let end = parseTime(j.selesai);
                        if (now >= start && now <= end) {
                            currentJam = j;
                            break;
                        }
                    }

                    if (currentJam && currentJam.jamKe !== "Istirahat/Lainnya") {
                        let pelajaran = currentJam.pelajaran[namaKelas];
                        if(pelajaran && pelajaran.kodeMapel && pelajaran.kodeMapel !== "") {
                            document.getElementById('hasil-jam').value = `Jam Ke-${currentJam.jamKe} | Mapel: ${pelajaran.kodeMapel}`;
                            
                            // Simpan ke variabel global untuk dikirim ke database
                            dataScanAktif = {
                                kodeKelas: decodedText,
                                namaKelas: namaKelas,
                                jamKe: currentJam.jamKe,
                                kodeMapel: pelajaran.kodeMapel,
                                kodeGuruJadwal: pelajaran.kodeGuru // Menyimpan kode guru yang seharusnya mengajar
                            };
                        } else {
                            document.getElementById('hasil-jam').value = "Jam Kosong untuk kelas ini.";
                            document.getElementById('btn-hadir').disabled = true;
                        }
                    } else {
                        document.getElementById('hasil-jam').value = "Sedang Jam Istirahat / Di luar KBM";
                        document.getElementById('btn-hadir').disabled = true;
                    }
                },
                (errorMessage) => { /* Abaikan error pembacaan frame per detik */ }
            );
        }

        // 4. Kirim Data Absen
        async function submitAbsen() {
            const nama = document.getElementById('namaGuru').value;
            const fileInput = document.getElementById('fotoSelfie');

            if(!nama || fileInput.files.length === 0) {
                alert("Mohon lengkapi nama dan foto selfie!");
                return;
            }

            document.getElementById('btn-hadir').innerText = "MENGIRIM...";
            document.getElementById('btn-hadir').disabled = true;

            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onloadend = async function() {
                const base64String = reader.result;
                
                const payload = {
                    namaGuru: nama,
                    kodeGuru: dataScanAktif.kodeGuruJadwal || "-", // Mengirim kode guru dari jadwal
                    kodeKelas: dataScanAktif.kodeKelas,
                    namaKelas: dataScanAktif.namaKelas,
                    tanggal: new Date().toLocaleDateString('id-ID'),
                    jamScan: new Date().toLocaleTimeString('id-ID'),
                    jamKe: dataScanAktif.jamKe,
                    kodeMapel: dataScanAktif.kodeMapel,
                    namaMapel: dataScanAktif.kodeMapel, // Bisa disesuaikan jika ingin nama panjang
                    fotoBase64: base64String
                };
                
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    if(result.status === 'success') {
                        alert("Absen Berhasil Disimpan!");
                        location.reload();
                    }
                } catch (e) {
                    alert("Terjadi kesalahan jaringan.");
                    document.getElementById('btn-hadir').innerText = "HADIR";
                    document.getElementById('btn-hadir').disabled = false;
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
